<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar | Você Sabia Rock</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="login" data-base="">
<div id="header-placeholder"></div>
<main class="auth">
  <section class="auth-poster" aria-hidden="true">
    <p class="mono">Área de editores</p>
    <h2>Back<br>stage<em>só para quem escreve.</em></h2>
  </section>
  <form class="pass" id="login-form" novalidate>
    <span class="pass-hole" aria-hidden="true"></span>
    <p class="mono pass-k">Acesso · Editores</p>
    <h1>Entrar</h1>
    <label for="email">E-mail</label>
    <input id="email" name="email" type="email" autocomplete="email">
    <p class="err" data-for="email"></p>
    <label for="senha">Senha</label>
    <input id="senha" name="senha" type="password" autocomplete="current-password">
    <p class="err" data-for="senha"></p>
    <button class="btn" type="submit">Entrar no backstage</button>
    <p class="form-msg" role="status"></p>
    <p class="pass-alt">Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
    <span class="barcode" aria-hidden="true"></span>
  </form>
</main>
<div id="player-placeholder"></div>
<script src="assets/js/main.js"></script>
<script src="assets/js/player.js"></script>
</body>
</html>
